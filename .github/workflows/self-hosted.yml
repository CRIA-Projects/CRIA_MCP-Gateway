name: Self-hosted Docker
on:
  push:
    branches: [feat/self-hosted-docker-sqlite]
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "package*.json"
      - ".github/workflows/self-hosted.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/smoke-docker.mjs
